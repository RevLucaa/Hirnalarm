name: Prüfen

# Bei jedem Push: Episoden und liga.json prüfen, Code-Check, jede Folge probeweise rendern, Bild-Test gegen Referenz.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt pyflakes
      - name: Episoden und Liga prüfen
        run: python3 tools/pruefen.py
      - name: Python-Code auf Fehler prüfen
        run: python3 -m pyflakes engine.py render/ tools/ | grep -E "undefined name '|invalid syntax" && exit 1 || true
      - name: Alle Folgen rendern sich fehlerfrei (Probe-Bilder mit Test-Ton)
        run: |
          python3 tools/testton.py /tmp/test.mp3 54
          for e in episodes/*/episode.json tests/demo_stimmen/episode.json; do
            echo "== $e"; python3 engine.py "$e" /tmp/test.mp3 /tmp/x.mp4 preview 1,20,40,55 > /dev/null
          done
      - name: Bild-Test (Aussehen gegenüber Referenz unverändert?)
        run: python3 tools/bildtest.py
